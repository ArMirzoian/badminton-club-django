version: '3.8'

services:
  # PostgreSQL база данных
  db:
    image: postgres:15-alpine
    container_name: badminton_db
    environment:
      POSTGRES_DB: badminton
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (опционально, для будущего использования с Celery)
  # redis:
  #   image: redis:7-alpine
  #   container_name: badminton_redis
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data

volumes:
  postgres_data:
    driver: local
  # redis_data:
  #   driver: local

# Для запуска:
# docker-compose up -d
#
# Для остановки:
# docker-compose down
#
# Для просмотра логов:
# docker-compose logs -f
#
# Для подключения к БД:
# docker-compose exec db psql -U postgres -d badminton
