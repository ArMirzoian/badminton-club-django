# Render.com deployment configuration
# https://render.com/docs/blueprint-spec

services:
  # Web service (Django)
  - type: web
    name: badminton-web
    env: python
    region: frankfurt  # ближайший к России регион
    plan: free  # бесплатный план для MVP
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements/prod.txt
      cd backend
      python manage.py collectstatic --no-input
      python manage.py migrate --no-input
    startCommand: |
      cd backend
      gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        sync: false  # заполнить вручную после создания
      - key: DATABASE_URL
        fromDatabase:
          name: badminton-db
          property: connectionString
      - key: EMAIL_HOST_USER
        sync: false  # заполнить вручную
      - key: EMAIL_HOST_PASSWORD
        sync: false  # заполнить вручную
      - key: TIME_ZONE
        value: Europe/Moscow
      - key: MAX_PLAYERS
        value: 18

  # Cron service (django-cron для расписания задач)
  - type: cron
    name: badminton-cron
    env: python
    region: frankfurt
    plan: free
    schedule: "* * * * *"  # каждую минуту проверяет задачи
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements/prod.txt
    startCommand: |
      cd backend
      python manage.py runcrons
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DATABASE_URL
        fromDatabase:
          name: badminton-db
          property: connectionString
      - fromGroup: badminton-web  # использует те же переменные что и web

databases:
  # PostgreSQL database
  - name: badminton-db
    databaseName: badminton
    user: badminton
    plan: free  # 512MB бесплатно
    region: frankfurt

# После деплоя:
# 1. Зайди в Dashboard → badminton-web → Environment
# 2. Добавь ALLOWED_HOSTS: your-app.onrender.com
# 3. Добавь EMAIL_HOST_USER и EMAIL_HOST_PASSWORD
# 4. Создай суперпользователя:
#    Render Shell → python manage.py createsuperuser
